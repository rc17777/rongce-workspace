tender_monitoring:
  enabled: false
  description: 通过招标公告发现新业务方向 — 仅抓取与经营范围匹配的招标品类
  scope:
    procurement_categories:
    - 审计服务
    - 工程咨询服务
    - 会计服务
    - 资产评估服务
    - 财务咨询服务
    - 绩效评价服务
    - 税务咨询服务
    - 工程造价咨询服务
    - 招标代理服务
    - 法律服务
    exclude_keywords:
    - 软件开发
    - 系统集成
    - 硬件采购
    - 物业服务
    - 保安服务
    - 保洁服务
    - 食堂
    - 印刷
    - 车辆
    min_budget_yuan: 50000
  data_sources:
  - name: 中国政府采购网
    url: http://www.ccgp.gov.cn/
    status: planned
  - name: 四川省政府采购网
    url: http://www.ccgp-sichuan.gov.cn/
    status: planned
  - name: 成都市公共资源交易中心
    url: https://www.cdggzy.com/
    status: planned
  - name: 中国招标投标公共服务平台
    url: http://www.cebpubservice.com/
    status: planned
  classification:
    round1: keyword_match
    round2: 同法规入库
    signal_weight: high
    incubation_threshold: 2
  outputs:
  - 市场机会追踪（谁在买、多少钱、在哪）
  - 新业务方向发现（对应现有业务线覆盖不到的服务需求）
  - 竞品情报（谁中标了、中标价、中标频率）
  created_at: '2026-07-11'
