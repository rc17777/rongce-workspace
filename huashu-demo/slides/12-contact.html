<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><title>联系方式</title><link rel="stylesheet" href="../shared/brochure-theme.css">
<style>
body{background:var(--warm);overflow:hidden}
.page{width:1920px;height:1080px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--warm)}
.frame{position:absolute;z-index:2}
.frame.tl{left:80px;top:80px;width:60px;height:60px;border-left:2px solid var(--gold);border-top:2px solid var(--gold)}
.frame.tr{right:80px;top:80px;width:60px;height:60px;border-right:2px solid var(--gold);border-top:2px solid var(--gold)}
.frame.bl{left:80px;bottom:80px;width:60px;height:60px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold)}
.frame.br{right:80px;bottom:80px;width:60px;height:60px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold)}
.verse{position:relative;z-index:3;text-align:center;margin-top:-40px}
.verse .main{font-family:var(--serif);font-size:68px;font-weight:800;letter-spacing:0.2em;line-height:1.35;color:var(--navy)}
.verse .main .hl{background:linear-gradient(135deg,var(--gold-dark),var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.verse .source{font-size:15px;letter-spacing:0.26em;color:rgba(26,92,110,0.6);margin-top:14px}
.verse .rule{width:60px;height:1px;margin:48px auto 0;background:var(--gold);opacity:0.3}
.contact{position:absolute;z-index:3;left:120px;right:120px;bottom:60px;text-align:center;color:rgba(10,31,63,0.55);font-family:var(--serif);letter-spacing:0.04em}
.contact .address{font-size:15px;line-height:1.9;margin-bottom:2px}
.contact .meta{font-size:14px;line-height:1.9;color:rgba(10,31,63,0.4)}
.contact .brand-line{font-size:13px;color:rgba(10,31,63,0.25);margin-top:10px;letter-spacing:0.12em}
</style></head>
<body>
<div class="page">
  <div class="frame tl"></div><div class="frame tr"></div><div class="frame bl"></div><div class="frame br"></div>
  <div class="verse">
    <div class="main">如切如磋&emsp;如琢如磨</div>
    <div class="source">——《诗经·卫风·淇奥》</div>
    <div class="rule"></div>
  </div>
  <div class="contact">
    <div class="address">四川省成都市金牛区高科技产业园区金周路595号珠宝中心1栋5楼501号</div>
    <div class="meta">028-87659276&emsp;&emsp;scrccpa@163.com</div>
    <div class="brand-line">四川融策会计师事务所有限公司 · 四川融策工程项目管理有限公司</div>
  </div>
</div>
</body></html>
