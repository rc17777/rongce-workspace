<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1920">
<title>封底</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap');
:root { --navy:#0A1F3F; --gold:#C5955C; --teal:#1A5C6E; --warm:#F5F2EC; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif SC',serif;width:1920px;height:1080px;overflow:hidden;background:var(--warm)}
.content{width:1920px;height:1080px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:url('../shared/back-cover-bg-light.png') center/cover no-repeat}
.content::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(245,242,236,.08) 0%, rgba(245,242,236,.18) 45%, rgba(245,242,236,.34) 100%);z-index:1}
.content::after{content:'';position:absolute;left:0;right:0;bottom:0;height:196px;background:linear-gradient(180deg, rgba(245,242,236,0) 0%, rgba(245,242,236,.82) 42%, rgba(245,242,236,.96) 100%);z-index:1}
.verse{position:relative;z-index:2;text-align:center;margin-top:-44px}
.main-verse{font-size:78px;font-weight:800;letter-spacing:.2em;line-height:1.38;color:var(--navy);text-shadow:0 2px 0 rgba(255,255,255,.52),0 12px 32px rgba(10,31,63,.12)}
.source{font-size:17px;letter-spacing:.26em;color:rgba(197,149,92,.88);margin-top:18px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.contact{position:absolute;z-index:2;left:120px;right:120px;bottom:54px;text-align:center;color:rgba(10,31,63,.72);font-family:'Noto Serif SC',serif;letter-spacing:.05em}
.address{font-size:17px;line-height:1.9;margin-bottom:4px}
.meta{font-size:16px;line-height:1.9;color:rgba(10,31,63,.58)}
.rule{width:84px;height:2px;margin:70px auto 0;background:linear-gradient(90deg,transparent,rgba(197,149,92,.9),transparent)}
.corner-mark{position:absolute;z-index:2;left:76px;top:72px;width:44px;height:44px;border-left:2px solid rgba(197,149,92,.58);border-top:2px solid rgba(197,149,92,.58)}
.corner-mark.right{left:auto;right:76px;top:auto;bottom:72px;transform:rotate(180deg)}
</style></head>
<body>
<div class="content">
  <div class="corner-mark"></div><div class="corner-mark right"></div>
  <div class="verse">
    <div class="main-verse">如切如磋&emsp;如琢如磨</div>
    <div class="source">——《诗经·卫风·淇奥》</div>
    <div class="rule"></div>
  </div>
  <div class="contact">
    <div class="address">四川省成都市金牛区高科技产业园区金周路595号珠宝中心1栋5楼501号</div>
    <div class="meta">028-87659276&emsp;&emsp;scrccpa@163.com</div>
  </div>
</div>
</body>
</html>
