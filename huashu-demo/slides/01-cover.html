<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>融策 · 政府审计宣传册</title>
<link rel="stylesheet" href="../shared/brochure-theme.css">
<style>
  body { background: var(--navy-dark); }
  .cover-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #06142A 0%, #0A1F3F 25%, #122A52 50%, #0A1F3F 75%, #06142A 100%);
  }
  .cover-bg::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 85% 15%, rgba(197,149,92,0.06) 0%, transparent 45%),
      radial-gradient(ellipse at 15% 85%, rgba(197,149,92,0.08) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(197,149,92,0.02) 0%, transparent 60%);
  }
  .geo-line { position: absolute; pointer-events: none; }
  .geo-line.h1 { left: 120px; top: 120px; right: 120px; height: 1px; background: linear-gradient(90deg, transparent, rgba(197,149,92,0.15), transparent); }
  .geo-line.h2 { left: 120px; bottom: 120px; right: 120px; height: 1px; background: linear-gradient(90deg, transparent, rgba(197,149,92,0.08), transparent); }
  .geo-line.v1 { left: 120px; top: 120px; bottom: 120px; width: 1px; background: linear-gradient(180deg, transparent, rgba(197,149,92,0.1), transparent); }
  .geo-line.v2 { right: 120px; top: 120px; bottom: 120px; width: 1px; background: linear-gradient(180deg, transparent, rgba(197,149,92,0.1), transparent); }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(197,149,92,0.04); pointer-events: none; }
  .ring.r1 { width: 500px; height: 500px; right: -100px; top: -200px; }
  .ring.r2 { width: 380px; height: 380px; left: -80px; bottom: -120px; }
  .ring.r3 { width: 200px; height: 200px; right: 300px; bottom: 80px; border-color: rgba(197,149,92,0.03); }
  .brand-symbol {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 420px; height: 420px;
    pointer-events: none; z-index: 0;
  }
  .brand-symbol .outer {
    position: absolute; inset: 0;
    border: 1px solid rgba(197,149,92,0.04);
    border-radius: 50%;
  }
  .brand-symbol .mid {
    position: absolute; left: 60px; right: 60px; top: 60px; bottom: 60px;
    border: 1px solid rgba(197,149,92,0.06);
    border-radius: 50%;
  }
  .brand-symbol .inner {
    position: absolute; left: 130px; right: 130px; top: 130px; bottom: 130px;
    border: 1px solid rgba(197,149,92,0.08);
    border-radius: 50%;
  }
  .brand-symbol .cross-h {
    position: absolute; left: 60px; right: 60px; top: 50%;
    height: 1px; background: rgba(197,149,92,0.04);
  }
  .brand-symbol .cross-v {
    position: absolute; top: 60px; bottom: 60px; left: 50%;
    width: 1px; background: rgba(197,149,92,0.04);
  }
  .grid-overlay {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(197,149,92,0.01) 1px, transparent 1px),
      linear-gradient(90deg, rgba(197,149,92,0.01) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
  }
  .hero {
    position: relative; z-index: 2;
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .hero-sup {
    font-size: 14px; letter-spacing: 0.5em;
    color: rgba(255,255,255,0.3); font-weight: 300;
    margin-bottom: 28px;
  }
  .hero-title {
    font-family: var(--font-serif);
    font-size: 80px; font-weight: 900; color: #fff;
    line-height: 1.12; text-align: center;
    margin-bottom: 16px; letter-spacing: 0.04em;
  }
  .hero-title .gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-sub {
    font-family: var(--font-serif);
    font-size: 24px; font-style: italic;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.08em; margin-bottom: 32px;
  }
  .hero-gold-line {
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    margin: 0 auto 32px;
  }
  .hero-tagline {
    font-family: var(--font-serif);
    font-size: 18px; color: rgba(255,255,255,0.45);
    line-height: 1.8; letter-spacing: 0.06em;
    margin-bottom: 40px; max-width: 700px; text-align: center;
  }
  .hero-stats {
    display: flex; gap: 48px; justify-content: center;
  }
  .hero-stat { text-align: center; }
  .hero-stat .num {
    font-family: var(--font-serif);
    font-size: 36px; font-weight: 700; line-height: 1;
    color: var(--gold-light);
  }
  .hero-stat .label {
    font-size: 13px; color: rgba(255,255,255,0.35);
    margin-top: 6px; letter-spacing: 0.05em;
  }
  .hero-stat .sep {
    width: 16px; height: 1px;
    background: rgba(197,149,92,0.2);
    margin: 8px auto 0;
  }
  .bottom-tag {
    position: absolute; z-index: 2;
    left: 50%; transform: translateX(-50%);
    bottom: 36px;
    font-size: 12px; letter-spacing: 0.15em;
    color: rgba(255,255,255,0.15);
  }
</style>
</head>
<body>
<div class="cover-bg"></div>
<div class="grid-overlay"></div>
<div class="brand-symbol">
  <div class="outer"></div>
  <div class="mid"></div>
  <div class="inner"></div>
  <div class="cross-h"></div>
  <div class="cross-v"></div>
</div>
<div class="geo-line h1"></div>
<div class="geo-line h2"></div>
<div class="geo-line v1"></div>
<div class="geo-line v2"></div>
<div class="ring r1"></div>
<div class="ring r2"></div>
<div class="ring r3"></div>

<div class="hero">
  <div class="hero-sup">SICHUAN RONGCE</div>
  <div class="hero-title">
    政府<span class="gold">审计</span> · 工程<span class="gold">咨询</span>
  </div>
  <div class="hero-sub">Government Audit &amp; Engineering Consulting</div>
  <div class="hero-gold-line"></div>
  <div class="hero-tagline">
    以审计证据链和数据穿透能力，服务财政资金治理现代化
  </div>
  <div class="hero-stats">
    <div class="hero-stat">
      <div class="num">12+</div>
      <div class="label">年政府审计经验</div>
      <div class="sep"></div>
    </div>
    <div class="hero-stat">
      <div class="num">12</div>
      <div class="label">核心业务线</div>
      <div class="sep"></div>
    </div>
    <div class="hero-stat">
      <div class="num">AI+</div>
      <div class="label">数据驱动审计</div>
      <div class="sep"></div>
    </div>
  </div>
</div>

<div class="bottom-tag">四川融策会计师事务所有限公司 · 四川融策工程项目管理有限公司</div>
</body>
</html>
