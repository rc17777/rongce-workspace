<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2480, initial-scale=1.0">
<title>融策 · 审盾</title>
<style>
  :root { --gold: #C5955C; --gold-light: #E8C87A; --navy: #0A1F3F; --navy-dark: #06142A; --serif: 'Microsoft YaHei', 'Noto Serif CJK SC', 'Source Han Serif SC', 'SimSun', serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2480px; height: 3508px; overflow: hidden; font-family: var(--serif); background: var(--navy-dark); }
  .bg { position: absolute; inset: 0; }
  .bg img { width: 100%; height: 100%; object-fit: cover; }
  .overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,20,42,0.35) 0%, rgba(6,20,42,0.15) 30%, rgba(6,20,42,0.05) 55%, rgba(6,20,42,0.25) 78%, rgba(6,20,42,0.45) 100%); }
  .content { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 280px; }

  .eyebrow { font-size: 28px; letter-spacing: 0.5em; color: rgba(255,255,255,0.38); font-weight: 300; margin-bottom: 48px; }
  .title-main { font-size: 220px; font-weight: 900; color: #fff; line-height: 1.05; letter-spacing: 0.08em; margin-bottom: 28px; }
  .title-main .dot { background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .subtitle { font-size: 56px; color: rgba(255,255,255,0.62); letter-spacing: 0.22em; margin-bottom: 68px; }
  .subtitle .sep { color: var(--gold-light); opacity: 0.82; margin: 0 38px; font-weight: 300; }

  .divider { width: 180px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); margin: 0 auto 68px; }

  .tagline { font-size: 42px; color: rgba(255,255,255,0.54); line-height: 1.85; letter-spacing: 0.07em; max-width: 1800px; text-align: center; margin-bottom: 100px; }
  .tagline em { font-style: normal; color: var(--gold-light); }

  .stats { display: flex; gap: 140px; justify-content: center; }
  .stat { text-align: center; min-width: 320px; }
  .stat .num { font-size: 82px; font-weight: 800; line-height: 1; color: var(--gold-light); }
  .stat .label { font-size: 26px; color: rgba(255,255,255,0.44); margin-top: 18px; letter-spacing: 0.06em; line-height: 1.45; }
  .stat .line { width: 36px; height: 2px; background: rgba(197,149,92,0.26); margin: 18px auto 0; }

  .footer { position: absolute; z-index: 2; left: 0; right: 0; bottom: 80px; text-align: center; font-size: 26px; letter-spacing: 0.18em; color: rgba(255,255,255,0.22); }
</style>
</head>
<body>
<div class="bg"><img src="output/cover-bg.png" alt=""></div>
<div class="overlay"></div>

<div class="content">
  <div class="eyebrow">SICHUAN RONGCE · AUDITSHIELD</div>
  <div class="title-main">融策<span class="dot">·</span>审盾</div>
  <div class="subtitle">政府审计<span class="sep">·</span>工程咨询</div>
  <div class="divider"></div>
  <div class="tagline">以<em>证据链质控</em>与<em>项目穿透能力</em>，服务财政资金治理现代化</div>
  <div class="stats">
    <div class="stat"><div class="num">20+年</div><div class="label">政府审计与财政资金治理经验</div><div class="line"></div></div>
    <div class="stat"><div class="num">2大板块</div><div class="label">会计师事务所 × 工程咨询公司</div><div class="line"></div></div>
    <div class="stat"><div class="num">1+4+N</div><div class="label">智析平台 · 四库 · 多场景实验室</div><div class="line"></div></div>
  </div>
</div>

<div class="footer">四川融策会计师事务所有限公司 · 四川融策工程项目管理有限公司</div>
</body>
</html>
