<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>融策 · 审盾</title>
<link rel="stylesheet" href="../shared/brochure-theme.css">
<style>
  body { background: var(--navy-dark); margin:0; padding:0; }
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg img { width: 100%; height: 100%; object-fit: cover; }
  .bg-overlay { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(6,20,42,0.32) 0%, rgba(6,20,42,0.08) 38%, rgba(6,20,42,0.02) 58%, rgba(6,20,42,0.28) 82%, rgba(6,20,42,0.48) 100%); }
  .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 120px; }
  .eyebrow { font-size: 13px; letter-spacing: 0.48em; color: rgba(255,255,255,0.35); margin-bottom: 22px; }
  .title { font-family: var(--serif); font-size: 108px; font-weight: 900; color: #fff; line-height: 1.02; letter-spacing: 0.07em; margin-bottom: 14px; }
  .title .gold { background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .subtitle { font-family: var(--serif); font-size: 27px; color: rgba(255,255,255,0.60); letter-spacing: 0.22em; margin-bottom: 34px; }
  .subtitle .sep { color: var(--gold-light); margin: 0 18px; }
  .divider { width: 90px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); margin-bottom: 34px; }
  .tagline { font-family: var(--serif); font-size: 20px; color: rgba(255,255,255,0.54); line-height: 1.82; letter-spacing: 0.06em; max-width: 840px; text-align: center; margin-bottom: 50px; }
  .tagline em { font-style: normal; color: var(--gold-light); }
  .stats { display: flex; gap: 70px; justify-content: center; }
  .stat { text-align: center; min-width: 160px; }
  .stat .num { font-family: var(--serif); font-size: 40px; font-weight: 800; color: var(--gold-light); line-height: 1; }
  .stat .label { font-size: 13px; color: rgba(255,255,255,0.42); margin-top: 8px; letter-spacing: 0.05em; line-height: 1.4; }
  .stat .line { width: 20px; height: 1px; background: rgba(197,149,92,0.22); margin: 10px auto 0; }
  .footer { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); bottom: 34px; font-size: 12px; letter-spacing: 0.15em; color: rgba(255,255,255,0.20); white-space: nowrap; }
</style>
</head>
<body>
<div class="bg"><img src="../output/cover-bg-hires.png" alt=""></div>
<div class="bg-overlay"></div>

<div class="content">
  <div class="eyebrow">SICHUAN RONGCE · AUDITSHIELD</div>
  <div class="title">融策<span class="gold">·</span>审盾</div>
  <div class="subtitle">政府审计<span class="sep">·</span>工程咨询</div>
  <div class="divider"></div>
  <div class="tagline">以<em>证据链质控</em>与<em>项目穿透能力</em>，服务财政资金治理现代化</div>
  <div class="stats">
    <div class="stat"><div class="num">20+年</div><div class="label">政府审计与财政资金治理经验</div><div class="line"></div></div>
    <div class="stat"><div class="num">2大板块</div><div class="label">会计师事务所 × 工程咨询公司</div><div class="line"></div></div>
    <div class="stat"><div class="num">1+4+N</div><div class="label">智析平台 · 四库 · 多场景实验室</div><div class="line"></div></div>
  </div>
</div>

<div class="footer">四川融策会计师事务所有限公司 · 四川融策工程项目管理有限公司</div>
</body>
</html>
