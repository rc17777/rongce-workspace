<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>融策 · 审盾</title>
<link rel="stylesheet" href="../shared/brochure-theme.css">
<style>
  body { background: var(--navy-dark); }
  .cover-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #071B36 0%, #0A1F3F 28%, #14345F 52%, #0A1F3F 78%, #071B36 100%);
  }
  .cover-bg::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 82% 18%, rgba(197,149,92,0.08) 0%, transparent 42%),
      radial-gradient(ellipse at 18% 84%, rgba(197,149,92,0.10) 0%, transparent 44%),
      radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.025) 0%, transparent 58%);
  }
  .geo-line { position: absolute; pointer-events: none; }
  .geo-line.h1 { left: 120px; top: 120px; right: 120px; height: 1px; background: linear-gradient(90deg, transparent, rgba(197,149,92,0.18), transparent); }
  .geo-line.h2 { left: 120px; bottom: 120px; right: 120px; height: 1px; background: linear-gradient(90deg, transparent, rgba(197,149,92,0.10), transparent); }
  .geo-line.v1 { left: 120px; top: 120px; bottom: 120px; width: 1px; background: linear-gradient(180deg, transparent, rgba(197,149,92,0.11), transparent); }
  .geo-line.v2 { right: 120px; top: 120px; bottom: 120px; width: 1px; background: linear-gradient(180deg, transparent, rgba(197,149,92,0.11), transparent); }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(197,149,92,0.05); pointer-events: none; }
  .ring.r1 { width: 500px; height: 500px; right: -100px; top: -200px; }
  .ring.r2 { width: 380px; height: 380px; left: -80px; bottom: -120px; }
  .ring.r3 { width: 220px; height: 220px; right: 300px; bottom: 80px; border-color: rgba(197,149,92,0.04); }
  .brand-symbol { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 440px; height: 440px; pointer-events: none; z-index: 0; opacity:.9; }
  .brand-symbol .outer { position: absolute; inset: 0; border: 1px solid rgba(197,149,92,0.055); border-radius: 50%; }
  .brand-symbol .mid { position: absolute; left: 62px; right: 62px; top: 62px; bottom: 62px; border: 1px solid rgba(197,149,92,0.07); border-radius: 50%; }
  .brand-symbol .inner { position: absolute; left: 132px; right: 132px; top: 132px; bottom: 132px; border: 1px solid rgba(197,149,92,0.09); border-radius: 50%; }
  .brand-symbol .cross-h { position: absolute; left: 62px; right: 62px; top: 50%; height: 1px; background: rgba(197,149,92,0.045); }
  .brand-symbol .cross-v { position: absolute; top: 62px; bottom: 62px; left: 50%; width: 1px; background: rgba(197,149,92,0.045); }
  .grid-overlay { position: absolute; inset: 0; background-image: linear-gradient(rgba(197,149,92,0.012) 1px, transparent 1px), linear-gradient(90deg, rgba(197,149,92,0.012) 1px, transparent 1px); background-size: 80px 80px; pointer-events: none; }
  .hero { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hero-sup { font-size: 13px; letter-spacing: 0.45em; color: rgba(255,255,255,0.34); font-weight: 300; margin-bottom: 26px; }
  .hero-title { font-family: var(--serif); font-size: 92px; font-weight: 900; color: #fff; line-height: 1.08; text-align: center; margin-bottom: 18px; letter-spacing: 0.08em; }
  .hero-title .gold { background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .hero-sub { font-family: var(--serif); font-size: 26px; color: rgba(255,255,255,0.60); letter-spacing: 0.18em; margin-bottom: 30px; }
  .hero-sub .dot { color: var(--gold-light); margin: 0 16px; opacity: 0.85; }
  .hero-gold-line { width: 92px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); margin: 0 auto 30px; }
  .hero-tagline { font-family: var(--serif); font-size: 19px; color: rgba(255,255,255,0.52); line-height: 1.85; letter-spacing: 0.06em; margin-bottom: 42px; max-width: 920px; text-align: center; }
  .hero-stats { display: flex; gap: 58px; justify-content: center; }
  .hero-stat { text-align: center; min-width: 150px; }
  .hero-stat .num { font-family: var(--serif); font-size: 38px; font-weight: 800; line-height: 1; color: var(--gold-light); }
  .hero-stat .label { font-size: 13px; color: rgba(255,255,255,0.42); margin-top: 8px; letter-spacing: 0.05em; line-height:1.35; }
  .hero-stat .sep { width: 18px; height: 1px; background: rgba(197,149,92,0.24); margin: 10px auto 0; }
  .bottom-tag { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); bottom: 36px; font-size: 12px; letter-spacing: 0.15em; color: rgba(255,255,255,0.20); white-space:nowrap; }
</style>
</head>
<body>
<div class="cover-bg"></div>
<div class="grid-overlay"></div>
<div class="brand-symbol"><div class="outer"></div><div class="mid"></div><div class="inner"></div><div class="cross-h"></div><div class="cross-v"></div></div>
<div class="geo-line h1"></div><div class="geo-line h2"></div><div class="geo-line v1"></div><div class="geo-line v2"></div>
<div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>

<div class="hero">
  <div class="hero-sup">SICHUAN RONGCE · AUDITSHIELD</div>
  <div class="hero-title">融策<span class="gold">·</span>审盾</div>
  <div class="hero-sub">政府审计<span class="dot">·</span>工程咨询</div>
  <div class="hero-gold-line"></div>
  <div class="hero-tagline">以证据链质控与项目穿透能力，服务财政资金治理现代化</div>
  <div class="hero-stats">
    <div class="hero-stat"><div class="num">20+年</div><div class="label">政府审计与财政资金治理经验</div><div class="sep"></div></div>
    <div class="hero-stat"><div class="num">2大板块</div><div class="label">会计师事务所 × 工程咨询公司</div><div class="sep"></div></div>
    <div class="hero-stat"><div class="num">1+4+N</div><div class="label">智析平台 · 四库 · 多场景实验室</div><div class="sep"></div></div>
  </div>
</div>

<div class="bottom-tag">四川融策会计师事务所有限公司 · 四川融策工程项目管理有限公司</div>
</body>
</html>
