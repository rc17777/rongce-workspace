<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>融策 · 审盾</title>
<link rel="stylesheet" href="../shared/brochure-theme.css">
<style>
  :root { --gold: #A87A3E; --gold-light: #C5955C; --navy: #0A1F3F; --navy-light: #1A3A5C; --cream: #F5F2EC; }
  body { background: var(--cream); margin:0; padding:0; }
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg img { width: 100%; height: 100%; object-fit: cover; }
  .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 120px; }

  .eyebrow { font-size: 13px; letter-spacing: 0.48em; color: rgba(10,31,63,0.45); margin-bottom: 26px; }

  .title { font-family: var(--serif); font-size: 106px; font-weight: 900; color: var(--navy); line-height: 1.02; letter-spacing: 0.07em; margin-bottom: 14px; }
  .title .gold { background: linear-gradient(135deg, #A87A3E, #C5955C, #D4A86A); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .subtitle { font-family: var(--serif); font-size: 27px; color: rgba(10,31,63,0.62); letter-spacing: 0.22em; margin-bottom: 36px; }
  .subtitle .sep { color: var(--gold); margin: 0 18px; font-weight: 300; }

  .divider { width: 80px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin-bottom: 34px; }

  .tagline { font-family: var(--serif); font-size: 20px; color: rgba(10,31,63,0.52); line-height: 1.85; letter-spacing: 0.06em; max-width: 860px; text-align: center; margin-bottom: 56px; }
  .tagline em { font-style: normal; color: var(--gold); }

  .stats { display: flex; gap: 74px; justify-content: center; }
  .stat { text-align: center; min-width: 162px; }
  .stat .num { font-family: var(--serif); font-size: 42px; font-weight: 800; color: var(--navy); line-height: 1; }
  .stat .label { font-size: 13px; color: rgba(10,31,63,0.48); margin-top: 8px; letter-spacing: 0.05em; line-height: 1.45; }
  .stat .line { width: 20px; height: 1px; background: rgba(168,122,62,0.32); margin: 10px auto 0; }

  .footer { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); bottom: 36px; font-size: 12px; letter-spacing: 0.16em; color: rgba(10,31,63,0.28); white-space: nowrap; }
</style>
</head>
<body>
<div class="bg"><img src="../output/cover-bg-light.png" alt=""></div>

<div class="content">
  <div class="eyebrow">SICHUAN RONGCE · AUDITSHIELD</div>
  <div class="title">融策<span class="gold">·</span>审盾</div>
  <div class="subtitle">政府审计<span class="sep">·</span>工程咨询</div>
  <div class="divider"></div>
  <div class="tagline">以<em>证据链质控</em>与<em>项目穿透能力</em>，服务财政资金治理现代化</div>
  <div class="stats">
    <div class="stat"><div class="num">20+年</div><div class="label">政府审计与财政资金治理经验</div><div class="line"></div></div>
    <div class="stat"><div class="num">2大板块</div><div class="label">会计师事务所 × 工程咨询公司</div><div class="line"></div></div>
    <div class="stat"><div class="num">1+4+N</div><div class="label">智析平台 · 四库 · 多场景实验室</div><div class="line"></div></div>
  </div>
</div>

<div class="footer">四川融策会计师事务所有限公司 · 四川融策工程项目管理有限公司</div>
</body>
</html>
