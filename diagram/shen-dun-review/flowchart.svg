<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 750">
  <style>
    text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
  </style>

  <defs>
    <!-- Background grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8ecf1" stroke-width="0.5"/>
    </pattern>

    <!-- Standard arrowhead -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b95a5"/>
    </marker>
    <!-- Blue arrowhead -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a5c6e"/>
    </marker>
    <!-- Green arrowhead -->
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d8a4e"/>
    </marker>
    <!-- Red arrowhead -->
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <!-- Gold arrowhead -->
    <marker id="arrow-gold" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c5955c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafbfc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="680" height="58" fill="#0A1F3F"/>
  <text x="340" y="36" fill="white" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">融策·审盾 · 绩效评价报告AI复核流程</text>

  <!-- ====== STEP 1: 上传报告文档 ====== -->
  <rect x="210" y="80" width="260" height="48" rx="8" fill="white" stroke="#1a5c6e" stroke-width="2"/>
  <rect x="210" y="80" width="260" height="48" rx="8" fill="rgba(26, 92, 110, 0.06)"/>
  <text x="340" y="103" fill="#1a5c6e" font-size="13" font-weight="600" text-anchor="middle">📄 上传报告文档</text>
  <text x="340" y="118" fill="#8b95a5" font-size="9" text-anchor="middle">Word / PDF / 文本</text>

  <!-- Arrow 1→2 -->
  <line x1="340" y1="128" x2="340" y2="158" stroke="#8b95a5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== STEP 2: RAG知识库增强 ====== -->
  <rect x="210" y="165" width="260" height="48" rx="8" fill="white" stroke="#2d8a4e" stroke-width="2"/>
  <rect x="210" y="165" width="260" height="48" rx="8" fill="rgba(45, 138, 78, 0.06)"/>
  <text x="340" y="188" fill="#2d8a4e" font-size="13" font-weight="600" text-anchor="middle">📚 RAG知识库增强</text>
  <text x="340" y="203" fill="#8b95a5" font-size="9" text-anchor="middle">法规匹配 · 案例检索 · 审计要点</text>

  <!-- Arrow 2→3 -->
  <line x1="340" y1="213" x2="340" y2="243" stroke="#8b95a5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== STEP 3: 本地快速复核 ====== -->
  <rect x="210" y="250" width="260" height="52" rx="8" fill="white" stroke="#c5955c" stroke-width="2"/>
  <rect x="210" y="250" width="260" height="52" rx="8" fill="rgba(197, 149, 92, 0.06)"/>
  <text x="340" y="273" fill="#c5955c" font-size="13" font-weight="600" text-anchor="middle">🔍 本地快速复核</text>
  <text x="340" y="291" fill="#8b95a5" font-size="9" text-anchor="middle">错别字 · 金额 · 日期 · 合计 · 法规引用 · 单位</text>

  <!-- Arrow 3→4 -->
  <line x1="340" y1="302" x2="340" y2="332" stroke="#8b95a5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== STEP 4: 15维度AI深度复核 ====== -->
  <rect x="210" y="340" width="260" height="52" rx="8" fill="white" stroke="#c0392b" stroke-width="2"/>
  <rect x="210" y="340" width="260" height="52" rx="8" fill="rgba(192, 57, 43, 0.05)"/>
  <text x="340" y="363" fill="#c0392b" font-size="13" font-weight="600" text-anchor="middle">🤖 15维度AI深度复核</text>
  <text x="340" y="381" fill="#8b95a5" font-size="9" text-anchor="middle">10维正文 + 5维三方交叉比对</text>

  <!-- Arrow 4→5 -->
  <line x1="340" y1="392" x2="340" y2="422" stroke="#8b95a5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== STEP 5: 结果汇总输出 ====== -->
  <rect x="210" y="430" width="260" height="48" rx="8" fill="white" stroke="#0A1F3F" stroke-width="2"/>
  <rect x="210" y="430" width="260" height="48" rx="8" fill="rgba(10, 31, 63, 0.04)"/>
  <text x="340" y="453" fill="#0A1F3F" font-size="13" font-weight="600" text-anchor="middle">📊 结果汇总与分级输出</text>
  <text x="340" y="468" fill="#8b95a5" font-size="9" text-anchor="middle">P0重大矛盾 / P1重大遗漏 / P2口径差异</text>

  <!-- Arrow 5→Decision -->
  <line x1="340" y1="478" x2="340" y2="508" stroke="#8b95a5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ====== DECISION: 人工确认通过? ====== -->
  <polygon points="340,503 405,540 340,577 275,540" fill="white" stroke="#c5955c" stroke-width="2"/>
  <polygon points="340,503 405,540 340,577 275,540" fill="rgba(197, 149, 92, 0.08)"/>
  <text x="340" y="538" fill="#c5955c" font-size="12" font-weight="600" text-anchor="middle">人工确认</text>
  <text x="340" y="553" fill="#c5955c" font-size="10" font-weight="500" text-anchor="middle">通过?</text>

  <!-- YES branch (right) -->
  <line x1="405" y1="540" x2="470" y2="540" stroke="#2d8a4e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="438" y="533" fill="#2d8a4e" font-size="10" font-weight="600" text-anchor="middle">是</text>

  <!-- YES box: 报告归档 -->
  <rect x="475" y="515" width="155" height="50" rx="8" fill="white" stroke="#2d8a4e" stroke-width="2"/>
  <rect x="475" y="515" width="155" height="50" rx="8" fill="rgba(45, 138, 78, 0.06)"/>
  <text x="552" y="540" fill="#2d8a4e" font-size="13" font-weight="600" text-anchor="middle">✅ 报告归档</text>
  <text x="552" y="556" fill="#8b95a5" font-size="9" text-anchor="middle">提交客户</text>

  <!-- NO branch (left) -->
  <line x1="275" y1="540" x2="210" y2="540" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="242" y="533" fill="#c0392b" font-size="10" font-weight="600" text-anchor="middle">否</text>

  <!-- NO box: 修改后重审 -->
  <rect x="50" y="515" width="155" height="50" rx="8" fill="white" stroke="#c0392b" stroke-width="2"/>
  <rect x="50" y="515" width="155" height="50" rx="8" fill="rgba(192, 57, 43, 0.05)"/>
  <text x="127" y="540" fill="#c0392b" font-size="13" font-weight="600" text-anchor="middle">🔄 修改后重审</text>
  <text x="127" y="556" fill="#8b95a5" font-size="9" text-anchor="middle">定位问题 → 修改</text>

  <!-- Loop back arrow: from NO box down and around to Step 3 -->
  <path d="M 127 565 L 127 610 L 75 610 L 75 276 L 205 276" 
        fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="77" y="450" fill="#c0392b" font-size="8" font-weight="500" text-anchor="middle" transform="rotate(-90, 77, 450)">返回复核</text>

  <!-- Legend -->
  <rect x="20" y="640" width="640" height="90" rx="8" fill="white" stroke="#dce1e8" stroke-width="1"/>
  <text x="340" y="658" fill="#0A1F3F" font-size="11" font-weight="600" text-anchor="middle">图例</text>

  <!-- Legend items -->
  <rect x="40" y="668" width="14" height="14" rx="3" fill="rgba(26, 92, 110, 0.06)" stroke="#1a5c6e" stroke-width="1.5"/>
  <text x="60" y="679" fill="#555" font-size="9">输入/准备</text>

  <rect x="160" y="668" width="14" height="14" rx="3" fill="rgba(45, 138, 78, 0.06)" stroke="#2d8a4e" stroke-width="1.5"/>
  <text x="180" y="679" fill="#555" font-size="9">知识增强 / 通过</text>

  <rect x="320" y="668" width="14" height="14" rx="3" fill="rgba(197, 149, 92, 0.06)" stroke="#c5955c" stroke-width="1.5"/>
  <text x="340" y="679" fill="#555" font-size="9">规则检查 / 决策</text>

  <rect x="475" y="668" width="14" height="14" rx="3" fill="rgba(192, 57, 43, 0.05)" stroke="#c0392b" stroke-width="1.5"/>
  <text x="495" y="679" fill="#555" font-size="9">AI分析 / 告警</text>

  <rect x="40" y="690" width="14" height="14" rx="3" fill="rgba(10, 31, 63, 0.04)" stroke="#0A1F3F" stroke-width="1.5"/>
  <text x="60" y="701" fill="#555" font-size="9">输出 / 汇总</text>

  <line x1="210" y1="694" x2="250" y2="694" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="258" y="698" fill="#555" font-size="9">循环 / 返回</text>
</svg>