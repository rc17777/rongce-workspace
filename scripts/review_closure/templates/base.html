<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}审盾质控系统{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .severity-P0 { @apply bg-red-100 text-red-800 border-red-300; }
        .severity-P1 { @apply bg-yellow-100 text-yellow-800 border-yellow-300; }
        .severity-P2 { @apply bg-green-100 text-green-800 border-green-300; }
        .status-pending { @apply bg-gray-100 text-gray-800; }
        .status-accepted { @apply bg-green-100 text-green-800; }
        .status-rejected { @apply bg-red-100 text-red-800; }
        .status-modified { @apply bg-blue-100 text-blue-800; }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-blue-900 text-white shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🛡️</span>
                    <h1 class="text-xl font-bold">审盾质控系统</h1>
                </div>
                <div class="flex space-x-6">
                    <a href="{{ url_for('dashboard') }}" class="hover:text-blue-200">看板</a>
                    <a href="{{ url_for('queue_list') }}" class="hover:text-blue-200">队列</a>
                </div>
            </div>
        </div>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="container mx-auto px-6 py-4">
                {% for category, message in messages %}
                    <div class="mb-2 px-4 py-2 rounded {% if category == 'error' %}bg-red-100 text-red-800{% elif category == 'success' %}bg-green-100 text-green-800{% else %}bg-yellow-100 text-yellow-800{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main class="container mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-gray-400 text-center py-4 mt-12">
        <p>融策·审盾 v1.0 | 复核意见自动流转 + 推演过程全留痕</p>
    </footer>
</body>
</html>
