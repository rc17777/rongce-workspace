<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#20203A"/><stop offset="50%" stop-color="#1A1A2E"/><stop offset="100%" stop-color="#12121F"/>
</linearGradient>
<linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#EED98C"/><stop offset="100%" stop-color="#B8912E"/>
</linearGradient>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<circle cx="1830" cy="60" r="230" fill="none" stroke="#D4AF37" stroke-opacity="0.06" stroke-width="1.5"/>
<circle cx="1830" cy="60" r="150" fill="none" stroke="#D4AF37" stroke-opacity="0.09" stroke-width="1"/>
<text x="140" y="106" font-family="Microsoft YaHei" font-size="17" letter-spacing="5" fill="#D4AF37" fill-opacity="0.75">RONGCE · CASE STUDIES</text>
<text x="1780" y="106" text-anchor="end" font-family="Microsoft YaHei" font-size="17" letter-spacing="2" fill="#6A6F80">05 / 10</text>
<rect x="140" y="162" width="6" height="48" fill="url(#goldText)"/>
<text x="172" y="202" font-family="Microsoft YaHei" font-size="46" font-weight="700" fill="#F5F2EC">典型服务案例</text>
<text x="174" y="240" font-family="Microsoft YaHei" font-size="16" letter-spacing="5" fill="#8A90A3">REPRESENTATIVE CASES</text>
<g>
<rect x="140" y="320" width="520" height="560" rx="18" fill="#FFFFFF" fill-opacity="0.03" stroke="#D4AF37" stroke-opacity="0.25"/>
<rect x="140" y="320" width="520" height="8" rx="4" fill="url(#goldText)"/>
<text x="188" y="416" font-family="Microsoft YaHei" font-size="16" letter-spacing="4" fill="#D4AF37" fill-opacity="0.8">CASE 01 · 绩效评价</text>
<text x="188" y="482" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#F5F2EC">某市财政局</text>
<text x="188" y="524" font-family="Microsoft YaHei" font-size="19" fill="#9DA3B6">财政支出绩效评价项目群</text>
<line x1="188" y1="570" x2="612" y2="570" stroke="#D4AF37" stroke-opacity="0.18"/>
<text x="188" y="668" font-family="Microsoft YaHei" font-size="58" font-weight="700" fill="url(#goldText)">3 亿元</text>
<text x="188" y="710" font-family="Microsoft YaHei" font-size="17" fill="#8A90A3">涉及财政资金规模</text>
<text x="188" y="792" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#F5F2EC">50+ <tspan font-size="18" fill="#8A90A3" font-weight="400">评价项目</tspan></text>
<text x="188" y="844" font-family="Microsoft YaHei" font-size="17" fill="#A9AEC0">覆盖民生 · 基建 · 产业扶持等领域</text>
</g>
<g>
<rect x="700" y="320" width="520" height="560" rx="18" fill="#FFFFFF" fill-opacity="0.03" stroke="#D4AF37" stroke-opacity="0.25"/>
<rect x="700" y="320" width="520" height="8" rx="4" fill="url(#goldText)"/>
<text x="748" y="416" font-family="Microsoft YaHei" font-size="16" letter-spacing="4" fill="#D4AF37" fill-opacity="0.8">CASE 02 · 资产清查</text>
<text x="748" y="482" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#F5F2EC">某市交通局</text>
<text x="748" y="524" font-family="Microsoft YaHei" font-size="19" fill="#9DA3B6">系统资产清查与账实核对</text>
<line x1="748" y1="570" x2="1172" y2="570" stroke="#D4AF37" stroke-opacity="0.18"/>
<text x="748" y="668" font-family="Microsoft YaHei" font-size="58" font-weight="700" fill="url(#goldText)">2.5 亿元</text>
<text x="748" y="710" font-family="Microsoft YaHei" font-size="17" fill="#8A90A3">清查资产总规模</text>
<text x="748" y="792" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#F5F2EC">20+ <tspan font-size="18" fill="#8A90A3" font-weight="400">下属单位</tspan></text>
<text x="748" y="844" font-family="Microsoft YaHei" font-size="17" fill="#A9AEC0">建立资产台账 · 出具核查报告</text>
</g>
<g>
<rect x="1260" y="320" width="520" height="560" rx="18" fill="#FFFFFF" fill-opacity="0.03" stroke="#D4AF37" stroke-opacity="0.25"/>
<rect x="1260" y="320" width="520" height="8" rx="4" fill="url(#goldText)"/>
<text x="1308" y="416" font-family="Microsoft YaHei" font-size="16" letter-spacing="4" fill="#D4AF37" fill-opacity="0.8">CASE 03 · 经济责任审计</text>
<text x="1308" y="482" font-family="Microsoft YaHei" font-size="30" font-weight="700" fill="#F5F2EC">某县审计局</text>
<text x="1308" y="524" font-family="Microsoft YaHei" font-size="19" fill="#9DA3B6">领导干部经济责任审计</text>
<line x1="1308" y1="570" x2="1732" y2="570" stroke="#D4AF37" stroke-opacity="0.18"/>
<text x="1308" y="668" font-family="Microsoft YaHei" font-size="58" font-weight="700" fill="url(#goldText)">8000 万</text>
<text x="1308" y="710" font-family="Microsoft YaHei" font-size="17" fill="#8A90A3">推动整改落实金额</text>
<text x="1308" y="792" font-family="Microsoft YaHei" font-size="34" font-weight="700" fill="#F5F2EC">15+ <tspan font-size="18" fill="#8A90A3" font-weight="400">审计项目</tspan></text>
<text x="1308" y="844" font-family="Microsoft YaHei" font-size="17" fill="#A9AEC0">任中离任并举 · 四道关审计法</text>
</g>
<text x="960" y="946" text-anchor="middle" font-family="Microsoft YaHei" font-size="16" letter-spacing="3" fill="#6A6F80">* 以上为部分代表性案例，更多业绩资料备索</text>
<line x1="140" y1="1008" x2="1780" y2="1008" stroke="#D4AF37" stroke-opacity="0.15"/>
<text x="140" y="1042" font-family="Microsoft YaHei" font-size="15" fill="#6A6F80">四川融策会计师事务所 · 四川融策工程咨询有限公司</text>
<text x="1780" y="1042" text-anchor="end" font-family="Microsoft YaHei" font-size="15" letter-spacing="3" fill="#D4AF37" fill-opacity="0.7">SICHUAN RONGCE</text>
</svg>
